[package]
name = "rust-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2"
rustc-hash = "2"
# docs.rs/getrandom/latest/getrandom/#webassembly-support
getrandom = { version = "0.3", features = ["wasm_js"] }
fastrand = { version = "2.4.1", features = ["js"] }

# https://rustwasm.github.io/docs/wasm-bindgen/reference/arbitrary-data-with-serde.html
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Diz em qual campo do formulário a desserialização falhou (ex.: disciplinas[3].aulas)
serde_path_to_error = "0.1"
# Relógio que funciona no navegador (std::time::Instant não existe no wasm32)
web-time = "1.1.0"
# Paralelismo. No navegador as threads são Web Workers criados pelo wasm-bindgen-rayon
rayon = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde_json = "1"

# [workspace]
# members = [
#     "crates/*"
# ]
# resolver = "2"

[profile.release]
# Tell LLVM to optimize for size instead of speed. 
# opt-level = 's' 
# Optimize for speed with opt-level 3
opt-level = 3

# Link Time Optimization (LTO) enables cross-crate dead code elimination
lto = true 

# Reduce the number of parallel code generation units to 1 
# to enable maximum optimization at the cost of compile time.
codegen-units = 1

# Remove panic unwinding code (reduces size and binary complexity)
panic = 'abort'

# Strip debug symbols and line tables from the final binary.
strip = true

[package.metadata.wasm-pack.profile.release]
# Pass the '-Os' flag to wasm-opt for size-focused optimizations
# wasm-opt = ['-Os', '--enable-bulk-memory']

# Optmize for speed with '-O3' flag to wasm-opt
wasm-opt = [
    '-O3',
    '--enable-bulk-memory', 
    '--enable-nontrapping-float-to-int',
    '--enable-simd',
    '--enable-threads',
]
